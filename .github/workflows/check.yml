# Static checks and every drill, on GitHub-hosted runners only. This
# workflow never runs on a self-hosted runner: code from a pull request must
# not reach a host this project manages.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned shellcheck
        run: |
          archive="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "SHELLCHECK=$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" >> "$GITHUB_ENV"

      - name: Record the tree under test
        run: |
          echo "commit $(git rev-parse HEAD)"
          echo "tree   $(git rev-parse 'HEAD^{tree}')"
          bash --version | head -1
          "$SHELLCHECK" --version | sed -n 2p

      - name: Static checks and drills
        run: bash tests/run.sh
