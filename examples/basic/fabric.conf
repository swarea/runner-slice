# Host-wide policy for every runner on this host.
#
# slice        the systemd slice all runners join; a dash in its name is
#              hierarchy (ci-x.slice lives inside ci.slice)
# name-prefix  runner units are <prefix>[-<id>]-runner.service and runtime
#              roots are /var/lib/<prefix>[-<id>]
# user-prefix  runner accounts are <prefix>[-<id>]
# host-label   the label every runner on this host carries, so a workflow can
#              select this host explicitly
slice            ci.slice
name-prefix      ci
user-prefix      runner
host-label       lab

# The ceiling all runners share, together. There are no defaults: these
# numbers are an example for a small host, not a recommendation. Measure your
# heaviest job and leave the rest of the host what it needs.
slice-cpu-quota     100%
slice-memory-high   1536M
slice-memory-max    2G
slice-tasks-max     1024

# Optional, repeatable: addresses no job may reach. Provider-specific; for
# example a cloud's instance metadata address. On its own this is one closed
# door, not a network policy.
# slice-ip-deny     169.254.169.254/32

resource-class   shared
sandbox-class    baseline
sandbox-class    userns

# Paths no runner may see. The Docker socket entries are mandatory: access to
# that socket is root on the host. Add the trees your other services own.
# A leading '-' means "if it exists", so a missing path does not stop a unit.
common-mask      -/run/docker.sock
common-mask      -/var/run/docker.sock
common-mask      -/srv/example-app

# Paths the runner accounts must not be able to read at all, even from a
# login shell outside their service. The check proves it; nothing changes
# permissions for you.
# protected-path   /srv/example-app/.env
