# Host-wide policy for every runner on this host.
#
# slice        the systemd slice all runners join; its limits live in the
#              slice unit, which the operator writes for this host
# name-prefix  runner units are <prefix>[-<id>]-runner.service and runtime
#              roots are /var/lib/<prefix>[-<id>]
# user-prefix  runner accounts are <prefix>[-<id>]
# host-label   the label every runner on this host carries, so a workflow can
#              select this host explicitly
slice            ci.slice
name-prefix      ci
user-prefix      runner
host-label       lab

resource-class   shared
sandbox-class    baseline
sandbox-class    userns

# Paths no runner may see. The Docker socket entries are mandatory: access to
# that socket is root on the host. Add the trees your other services own.
# A leading '-' means "if it exists", so a missing path does not stop a unit.
common-mask      -/run/docker.sock
common-mask      -/var/run/docker.sock
common-mask      -/srv/example-app
